[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-framework"
version = "0.1.0"
description = "Agents propose. Harness verifies. Evidence decides."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.scripts]
harness = "harness.cli:run_cli"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["resources/schemas/*.json", "resources/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
